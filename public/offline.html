<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Landed — offline</title>
    <style>
      @font-face { font-family: "Nuckle"; src: url("/fonts/nuckle-semibold.ttf") format("truetype"); font-weight: 600; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "Nuckle", system-ui, sans-serif;
        background: linear-gradient(180deg, #FFFFFF 0%, #F4F3C6 45%, #DEEB3A 100%);
        color: #111111;
        display: flex; flex-direction: column; justify-content: center;
        padding: 0 21px; box-sizing: border-box; gap: 16px;
      }
      img { width: 30px; height: auto; }
      h1 { font-size: 38px; font-weight: 600; line-height: 1.05; margin: 0; }
      p { font-size: 14px; color: #767766; margin: 0; max-width: 32ch; }
      button {
        align-self: flex-start; margin-top: 8px; border: none; border-radius: 999px;
        padding: 14px 22px; font: inherit; font-weight: 600; font-size: 14px; color: #111111;
        background: linear-gradient(100deg, #EFF3A8 0%, #DEEB3A 100%); cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="Landed" />
    <h1>You're offline</h1>
    <p>Landed needs a connection to find places near you. Check your signal or Wi-Fi, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
